<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://raw.githubusercontent.com https://api.github.com blob: data:; worker-src 'self' blob:;"
    />
    <title>OmniPDF Studio - Suíte Completa de PDF</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('omnipdf_theme_id') || 'dark-slate';
          var isDark = true;
          if (saved === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            saved = isDark ? 'dark-slate' : 'light-pure';
          } else if (saved === 'scheduled') {
            var now = new Date();
            var mins = now.getHours() * 60 + now.getMinutes();
            var dStart = localStorage.getItem('omnipdf_theme_day_start') || '06:00';
            var nStart = localStorage.getItem('omnipdf_theme_night_start') || '18:00';
            var pD = dStart.split(':').map(Number);
            var pN = nStart.split(':').map(Number);
            var startM = (pD[0] || 6) * 60 + (pD[1] || 0);
            var endM = (pN[0] || 18) * 60 + (pN[1] || 0);
            var isDay = mins >= startM && mins < endM;
            saved = isDay ? 'light-pure' : 'dark-slate';
            isDark = !isDay;
          } else {
            isDark = saved.indexOf('dark') === 0;
          }
          document.documentElement.setAttribute('data-theme', saved);
          document.documentElement.setAttribute('data-theme-group', isDark ? 'dark' : 'light');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
